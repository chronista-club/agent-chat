[package]
name = "agent-chat-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
agent-chat-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["process"] }
# MCP フォームの検証。外部参照は依存側で無効（default-features = false）。
jsonschema = { version = "0.56", default-features = false }
url = "2"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "time"] }
